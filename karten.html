<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arcana — Karten ziehen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#150F1C;
    --surface:#1F1729;
    --surface-2:#2B2136;
    --gold:#B9975B;
    --gold-dim: rgba(185,151,91,0.35);
    --blood:#8A3B3B;
    --text:#EDE6DA;
    --muted:#948C9E;
    --line: rgba(185,151,91,0.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(138,59,59,0.14), transparent),
      var(--ink);
    color:var(--text);
    font-family:'EB Garamond', serif;
    min-height:100vh;
    padding: max(24px, env(safe-area-inset-top)) 18px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .eyebrow{
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:'Cinzel',serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 18px;
    letter-spacing:0.02em;
  }

  .row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:12px;
    width:100%;
    max-width:460px;
  }
  .row-btn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  .row-btn.active{
    color:var(--gold);
    border-color:var(--gold-dim);
    background:var(--surface-2);
  }
  #spreadRow{ margin-bottom:20px; }
  #spreadRow .row-btn{ flex:1; min-width:92px; }

  .draw-btn{
    font-family:'Cinzel',serif;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    background:var(--gold);
    color:var(--ink);
    border:none;
    padding:14px 30px;
    border-radius:30px;
    cursor:pointer;
    margin-bottom:30px;
    box-shadow: 0 0 24px rgba(185,151,91,0.25);
  }
  .draw-btn:active{ transform: scale(0.97); }
  .draw-btn:disabled{ opacity:0.6; }

  .cloth{
    width:100%;
    max-width:640px;
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .slot{ display:flex; flex-direction:column; align-items:center; }
  .slot-label{
    font-family:'Cinzel',serif;
    font-size:9.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
    height:14px;
    text-align:center;
  }

  .card-flip{
    perspective:1000px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%; height:100%;
    transition: transform 0.7s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card-flip.flipped .card-inner{ transform: rotateY(180deg); }

  .card-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--gold-dim);
    background:var(--surface);
  }
  .card-back{
    display:flex; align-items:center; justify-content:center;
  }
  .card-back svg{ width:70%; opacity:0.85; }

  .card-front{
    transform: rotateY(180deg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10px;
    gap:6px;
  }
  .card-front img{
    width:100%; height:auto;
    max-width:100%;
    object-fit:cover;
    border-radius:6px;
    transition: transform 0.4s ease;
  }
  .card-front.reversed img{ transform: rotate(180deg); }
  .card-symbol{ font-size:2rem; line-height:1; }

  .card-meta{
    text-align:center;
    margin-top:9px;
    min-height:18px;
    max-width:150px;
  }
  .card-name{
    font-family:'Cinzel',serif;
    font-size:12.5px;
    color:var(--text);
    line-height:1.3;
  }
  .card-orient{
    font-size:10px;
    color:var(--gold);
    margin-top:2px;
    letter-spacing:0.04em;
  }
  .card-orient.reversed{ color:var(--blood); }

  .meaning-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:10px;
    letter-spacing:0.04em;
    padding:4px 10px;
    border-radius:14px;
    margin-top:7px;
    cursor:pointer;
  }

  .meaning-text{
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
    margin-top:7px;
    max-width:150px;
    display:none;
    font-style:italic;
  }
  .meaning-text.open{ display:block; }

  .hint{
    color:var(--muted);
    font-size:12px;
    margin-top:26px;
    text-align:center;
    max-width:300px;
  }
</style>
</head>
<body>
  <div class="eyebrow">Arcana</div>
  <h1>Karten ziehen</h1>

  <div class="row" id="systemRow">
    <button class="row-btn active" data-system="tarot">🌙 Tarot</button>
    <button class="row-btn" data-system="lenormand">🌹 Lenormand</button>
    <button class="row-btn" data-system="kipper">🕯️ Kipper</button>

  <div class="row" id="spreadRow">

    <button class="row-btn" data-spread="einzel">Einzelkarte</button>
    <button class="row-btn" data-spread="janein">Ja/Nein</button>

    <button class="row-btn" data-spread="woche">Woche</button>

  </div>

  <button class="draw-btn" id="drawBtn">Karte(n) ziehen</button>

  <div class="cloth" id="cloth"></div>

  <div class="hint" id="hint">Wähle Kartensystem und Legemuster, dann ziehe deine Karte(n).</div>

  ["Kurze Krankheit","🌡️","Deutet auf vorübergehende Schwierigkeiten oder Schwächen hin"],
  ["Kummer und Widerwärtigkeiten","🌧️","Warnt vor Herausforderungen oder Sorgen"],
  ["Trübe Gedanken","🌫️","Symbolisiert negative Einstellungen oder pessimistische Phasen"],
  ["Arbeit/Beschäftigung","💼","Repräsentiert berufliche Aktivitäten oder Projekte"],
  ["Ein langer Weg","🛤️","Steht für Ausdauer, langfristige Ziele oder Entwicklungsprozesse"],
  ["Die Hoffnung/Großes Wasser","🌊","Symbolisiert Optimismus, Träume oder emotionale Tiefe"],
].map(([name,e,b])=>({name,emoji:e,meaning:b}));

const DECKS = { tarot: tarotDeck, lenormand: lenormandDeck, kipper: kipperDeck };

/* ---------- SPREADS ---------- */
const SPREADS = {
  tages:       { n:1,  labels:[''], seeded:true },
  einzel:      { n:1,  labels:[''] },
  janein:      { n:1,  labels:[''] },
  drei:        { n:3,  labels:['Vergangenheit','Gegenwart','Zukunft'] },
  beziehung:   { n:3,  labels:['Du','Die andere Person','Die Verbindung'] },
  kreuz:       { n:5,  labels:['Situation','Herausforderung','Vergangenheit','Zukunft','Ergebnis'] },
  woche:       { n:7,  labels:['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'] },
  keltenkreuz: { n:10, labels:['Situation','Herausforderung','Bewusstes Ziel','Vergangenheit','Mögliche Zukunft','Nahe Zukunft','Du selbst','Umfeld','Hoffnungen & Ängste','Ergebnis'] },
};

let currentSystem = "tarot";
let currentSpread = "tages";
let lastTagesKey = null;
let lastTagesCard = null;

document.querySelectorAll('#systemRow .row-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#systemRow .row-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSystem = btn.dataset.system;
    document.getElementById('cloth').innerHTML = '';
    document.getElementById('hint').textContent = 'Wähle Kartensystem und Legemuster, dann ziehe deine Karte(n).';
  });
});

document.querySelectorAll('#spreadRow .row-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#spreadRow .row-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSpread = btn.dataset.spread;
    document.getElementById('cloth').innerHTML = '';
    document.getElementById('hint').textContent = 'Tippe auf „Karte(n) ziehen“, um zu starten.';
  });
});

function seededRandom(seed){ let x = Math.sin(seed) * 10000; return x - Math.floor(x); }
function dateSeed(){ const d = new Date(); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); }

function pickCards(n, seeded){
  const pool = [...DECKS[currentSystem]];
  const picked = [];
  let seed = seeded ? dateSeed() : Math.floor(Math.random()*1000000);
  for(let i=0; i<n; i++){
    seed += 1;
    const r = seeded ? seededRandom(seed) : Math.random();
    const idx = Math.floor(r * pool.length);
    const card = pool.splice(idx,1)[0];
    let reversed = false;
    if(currentSystem === "tarot"){
      seed += 7;
      const rReversed = seeded ? seededRandom(seed*3.1) : Math.random();
      reversed = rReversed < 0.5;
    }
    picked.push({ ...card, reversed });
  }
  return picked;
}

const cardBackSVG = `
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="30" fill="none" stroke="#B9975B" stroke-width="1"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#B9975B" stroke-width="0.6"/>
  <path d="M50 20 L53 45 L78 50 L53 55 L50 80 L47 55 L22 50 L47 45 Z" fill="#B9975B" opacity="0.7"/>
</svg>`;

function cardSize(total){
  if(total <= 3) return { w:150, h:255, sym:'2rem', name:'12.5px' };
  if(total <= 6) return { w:120, h:200, sym:'1.6rem', name:'11px' };
  return { w:92, h:150, sym:'1.3rem', name:'10px' };
}

function renderSpread(cards, labels){
  const cloth = document.getElementById('cloth');
  cloth.innerHTML = '';
  const sz = cardSize(cards.length);
  cards.forEach((card, i)=>{
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.style.width = sz.w + 'px';

    if(labels[i]){
      const label = document.createElement('div');
      label.className = 'slot-label';
      label.textContent = labels[i];
      slot.appendChild(label);
    }

    const flip = document.createElement('div');
    flip.className = 'card-flip';
    flip.style.width = sz.w + 'px';
    flip.style.height = sz.h + 'px';

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';
    back.innerHTML = cardBackSVG;

    const front = document.createElement('div');
    front.className = 'card-face card-front' + (card.reversed ? ' reversed' : '');
    if(currentSystem === 'tarot'){
      front.innerHTML = `<img src="${card.url}" alt="${card.name}" onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('afterbegin','<div class=card-symbol>🌙</div>');" />`;
    } else {
      front.innerHTML = `<div class="card-symbol" style="font-size:${sz.sym}">${card.emoji}</div>`;
    }

    inner.appendChild(back);
    inner.appendChild(front);
    flip.appendChild(inner);
    slot.appendChild(flip);

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    slot.appendChild(meta);

    flip.addEventListener('click', ()=>{
      if(flip.classList.contains('flipped')) return;
      flip.classList.add('flipped');
      const orientHtml = currentSystem === 'tarot'
        ? `<div class="card-orient ${card.reversed ? 'reversed':''}">${card.reversed ? 'Umgekehrt':'Aufrecht'}</div>`
        : '';
      const meaningText = currentSystem === 'tarot'
        ? (card.reversed ? card.rev : card.up)
        : card.meaning;
      meta.innerHTML = `
        <div class="card-name" style="font-size:${sz.name}">${card.name}</div>
        ${orientHtml}
        <button class="meaning-toggle">Bedeutung</button>
        <div class="meaning-text">${meaningText}</div>
      `;
      const toggle = meta.querySelector('.meaning-toggle');
      const text = meta.querySelector('.meaning-text');
      toggle.addEventListener('click', ()=>{ text.classList.toggle('open'); });
    });

    cloth.appendChild(slot);
  });
  document.getElementById('hint').textContent = 'Tippe auf eine Karte, um sie umzudrehen.';
}

document.getElementById('drawBtn').addEventListener('click', ()=>{
  const cfg = SPREADS[currentSpread];
  const today = new Date().toDateString();
  const tagesKey = currentSystem + '_' + today;

  if(currentSpread === 'tages' && lastTagesKey === tagesKey && lastTagesCard){
    renderSpread([lastTagesCard], ['']);
    return;
  }

  const cards = pickCards(cfg.n, !!cfg.seeded);

  if(currentSpread === 'tages'){
    lastTagesKey = tagesKey;
    lastTagesCard = cards[0];
  }

  renderSpread(cards, cfg.labels);
});
</script>
</body>
</html>
