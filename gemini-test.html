<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Gemini API Test</title>
<style>
body{font-family:sans-serif;background:#12121f;color:#f1f0f5;padding:2rem;max-width:500px;margin:0 auto;}
input{width:100%;background:#1c1c2e;border:1px solid #333;border-radius:8px;color:#fff;padding:0.6rem;font-size:0.9rem;margin-bottom:0.5rem;box-sizing:border-box;}
button{background:#c084fc;border:none;border-radius:8px;color:#fff;padding:0.7rem 1.2rem;cursor:pointer;font-size:0.9rem;margin-bottom:1rem;}
pre{background:#1c1c2e;border-radius:8px;padding:1rem;white-space:pre-wrap;font-size:0.75rem;color:#9898b8;min-height:80px;}
</style>
</head>
<body>
<h2>Gemini API Test</h2>
<input type="text" id="key" placeholder="API Key hier einfügen..." autocomplete="off">
<br>
<button onclick="test()">Testen</button>
<pre id="out">Ergebnis erscheint hier…</pre>
<script>
async function test(){
  const key=document.getElementById('key').value.trim();
  const out=document.getElementById('out');
  if(!key){out.textContent='Bitte Key eingeben!';return;}
  out.textContent='Wird getestet…';
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:'Sag nur: Hallo Uli!'}]}]})
    });
    const data=await res.json();
    out.textContent=JSON.stringify(data,null,2);
  }catch(e){
    out.textContent='Fehler: '+e.message;
  }
}
</script>
</body>
</html>
