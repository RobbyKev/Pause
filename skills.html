<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pause – Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#12121f;--surface:#1c1c2e;--surface2:#242438;--border:rgba(255,255,255,0.07);--accent:#4ade80;--accent2:#2dd4bf;--text:#f1f0f5;--muted:#6b6b8a;--muted2:#9898b8;--danger:#f87171;--aRGB:74,222,128;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;height:100dvh;}

/* STARTSCREEN */
#startScreen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow-y:auto;padding:1.5rem 1rem 2rem;}
#startScreen.hidden{display:none;}
.start-logo{font-family:'DM Serif Display',serif;font-size:3rem;color:var(--accent);letter-spacing:-0.03em;margin-bottom:0.2rem;}
.start-sub{font-size:0.82rem;color:var(--muted);margin-bottom:2rem;text-align:center;}
.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.65rem;width:100%;max-width:360px;}
.start-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.25rem 1rem;display:flex;flex-direction:column;align-items:center;gap:0.5rem;cursor:pointer;transition:border-color 0.15s,transform 0.12s;}
.start-card:active{border-color:var(--accent);transform:scale(0.97);}
.start-card-icon{font-size:2.2rem;}
.start-card-label{font-size:0.82rem;font-weight:600;color:var(--text);}
.start-card-sub{font-size:0.62rem;color:var(--muted);text-align:center;}
.start-all{margin-top:0.65rem;width:100%;max-width:360px;}

/* TABS */
.tabs{display:none;}
.back-btn{display:flex;align-items:center;gap:0.4rem;background:var(--surface2);border:1px solid var(--border);border-radius:100px;color:var(--muted2);font-family:"DM Sans",sans-serif;font-size:0.75rem;font-weight:500;cursor:pointer;padding:0.35rem 0.75rem;margin-bottom:0.5rem;flex-shrink:0;width:fit-content;}

.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;min-width:52px;padding:0.65rem 0.3rem 0.45rem;border:none;background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:0.52rem;font-weight:500;letter-spacing:0.03em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.14rem;transition:color 0.15s;border-radius:0;}
.tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.tab.active{color:var(--accent);}
.screens{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;padding:0.9rem 0.85rem 2rem;display:none;flex-direction:column;gap:0.85rem;-webkit-overflow-scrolling:touch;}
.screen.active{display:flex;}
.display{font-family:'DM Serif Display',serif;font-size:1.3rem;line-height:1.25;color:var(--text);}
.label-tag{display:inline-flex;align-items:center;background:rgba(var(--aRGB),0.12);color:var(--accent);font-size:0.63rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:0.2em 0.6em;border-radius:100px;width:fit-content;}
.section-title{font-size:0.6rem;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:1.1rem;display:flex;flex-direction:column;gap:0.75rem;transition:opacity 0.22s,transform 0.22s,box-shadow 0.5s,border-color 0.5s;}
.card.fade-out{opacity:0;transform:translateY(5px);}
.card.done-flash{box-shadow:0 0 0 2px var(--accent),0 0 24px rgba(var(--aRGB),0.35);border-color:var(--accent);}
.card-img{width:100%;height:145px;object-fit:cover;border-radius:10px;display:none;}
.card-img.visible{display:block;}
.card-img-ph{width:100%;height:60px;border-radius:10px;border:1px dashed rgba(var(--aRGB),0.2);display:none;align-items:center;justify-content:center;color:var(--muted);font-size:0.72rem;text-align:center;}
.card-img-ph.visible{display:flex;}
.beschreibung{font-size:0.8rem;color:var(--muted2);line-height:1.6;font-weight:300;}
.pill-row{display:flex;flex-wrap:wrap;gap:0.3rem;}
.pill{padding:0.22em 0.62em;border-radius:100px;font-size:0.65rem;font-weight:500;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted2);cursor:pointer;transition:all 0.15s;width:auto;}
.pill.active{background:rgba(var(--aRGB),0.12);border-color:var(--accent);color:var(--accent);}
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:0.65rem;}
.timer-opts{display:flex;gap:0.3rem;}
.timer-opt{padding:0.22em 0.68em;border-radius:100px;font-size:0.67rem;font-weight:500;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted2);cursor:pointer;transition:all 0.15s;width:auto;}
.timer-opt.active{background:rgba(var(--aRGB),0.12);border-color:var(--accent);color:var(--accent);}
.t-wrap-big{position:relative;width:140px;height:140px;}
.t-wrap-big svg{transform:rotate(-90deg);width:140px;height:140px;}
.t-track{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:6;}
.t-ring{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.t-val-big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'DM Serif Display',serif;font-size:2rem;color:var(--text);letter-spacing:-0.02em;}
.tbts{display:flex;gap:0.38rem;}
.btn{border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.86rem;font-weight:500;cursor:pointer;padding:0.8rem 0.95rem;transition:transform 0.1s,opacity 0.1s;width:100%;}
.btn:active{transform:scale(0.97);opacity:0.82;}
.btn-p{background:var(--accent);color:#fff;}
.btn-g{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--accent2);}
.btn-sm{border:none;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:500;cursor:pointer;padding:0.36rem 0.88rem;transition:transform 0.1s,opacity 0.1s;width:auto;}
.btn-sm:active{transform:scale(0.96);}
.sm-s{background:var(--accent);color:#fff;}
.sm-r{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted2);}
.counter{font-size:0.65rem;color:var(--muted);text-align:center;}
.audio-btn{display:flex;align-items:center;gap:0.6rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.6rem 0.8rem;cursor:pointer;transition:border-color 0.15s;width:100%;text-align:left;}
.audio-btn.playing{border-color:var(--accent);background:rgba(var(--aRGB),0.08);}
.a-icon{width:27px;height:27px;border-radius:50%;background:rgba(var(--aRGB),0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.a-icon svg{width:11px;height:11px;fill:var(--accent);stroke:none;}
.a-title{font-size:0.78rem;font-weight:500;color:var(--text);}
.a-sub{font-size:0.66rem;color:var(--muted);margin-top:0.07rem;}
.a-stop{font-size:0.63rem;color:var(--accent);font-weight:500;margin-left:auto;flex-shrink:0;}
.atem-wrap{display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding:1rem 0;}
.atem-c{width:130px;height:130px;border-radius:50%;background:rgba(var(--aRGB),0.12);border:2px solid rgba(var(--aRGB),0.25);display:flex;align-items:center;justify-content:center;font-size:0.82rem;color:var(--accent);font-weight:500;transition:transform 4s ease-in-out,background 1s,border-color 1s;}
.atem-c.expand{transform:scale(1.4);background:rgba(var(--aRGB),0.22);border-color:rgba(var(--aRGB),0.6);}
.atem-c.hold{transform:scale(1.4);border-color:rgba(var(--aRGB),0.8);}
.atem-c.shrink{transform:scale(1);background:rgba(var(--aRGB),0.08);border-color:rgba(var(--aRGB),0.2);}
.atem-lbl{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--text);text-align:center;}
.atem-sub2{font-size:0.72rem;color:var(--muted);text-align:center;}
.atem-methods{display:flex;gap:0.4rem;flex-wrap:wrap;justify-content:center;}
.atem-method{padding:0.28em 0.75em;border-radius:100px;font-size:0.68rem;font-weight:500;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted2);cursor:pointer;transition:all 0.15s;width:auto;}
.atem-method.active{background:rgba(var(--aRGB),0.12);border-color:var(--accent);color:var(--accent);}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;}
.tc{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:0.95rem 0.7rem;display:flex;flex-direction:column;align-items:center;gap:0.4rem;cursor:pointer;transition:border-color 0.15s,transform 0.12s;}
.tc:active{border-color:var(--accent);transform:scale(0.97);}
.tc.selected{border-color:var(--accent);background:rgba(var(--aRGB),0.14);}
.tc.selected .tc-label{color:var(--accent);}
.tc-icon{font-size:1.7rem;line-height:1;}
.tc-label{font-size:0.73rem;font-weight:500;color:var(--text);text-align:center;}
.tc-sub{font-size:0.6rem;color:var(--muted);text-align:center;}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:600;display:none;flex-direction:column;}
.overlay.active{display:flex;}
.ov-hdr{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 0.95rem;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.ov-close{background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted2);font-size:0.9rem;flex-shrink:0;}
.ov-title{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--text);}
.ov-close{background:transparent;border:none;color:var(--muted2);font-size:1.3rem;cursor:pointer;padding:0.12rem 0.3rem;line-height:1;}
.ov-body{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--bg);}
.g-score{font-family:'DM Serif Display',serif;font-size:1.7rem;color:var(--accent);text-align:center;position:absolute;top:0.7rem;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;}
/* INSPO */
.inspo-section-label{font-size:0.62rem;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);padding:0.25rem 0;}
.inspo-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:1rem;display:flex;align-items:center;gap:0.85rem;cursor:pointer;transition:border-color 0.15s,transform 0.12s;text-decoration:none;}
.inspo-card:active{border-color:var(--accent);transform:scale(0.98);}
.inspo-avatar-ph{width:46px;height:46px;border-radius:50%;background:rgba(var(--aRGB),0.15);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.inspo-info{flex:1;}.inspo-name{font-size:0.85rem;font-weight:500;color:var(--text);}
.inspo-desc{font-size:0.7rem;color:var(--muted);margin-top:0.12rem;line-height:1.4;}
.inspo-arrow{color:var(--muted);font-size:1rem;flex-shrink:0;}
/* KALIMBA */
.kalimba-tines{display:flex;align-items:flex-end;gap:4px;height:220px;}
.tine{border-radius:4px 4px 0 0;cursor:pointer;touch-action:manipulation;flex-shrink:0;border:none;position:relative;}
.tine:active{filter:brightness(1.5);}
/* LAUNCHPAD */
.lp-modes{display:flex;gap:0.35rem;flex-wrap:wrap;padding:0.5rem 0.75rem;justify-content:center;flex-shrink:0;}
.lp-mode{padding:0.28em 0.75em;border-radius:100px;font-size:0.68rem;font-weight:500;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted2);cursor:pointer;transition:all 0.15s;width:auto;}
.lp-mode.active{background:rgba(var(--aRGB),0.12);border-color:var(--accent);color:var(--accent);}
.lp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:0.75rem;width:100%;}
.lp-btn{aspect-ratio:1;border-radius:8px;border:none;cursor:pointer;transition:filter 0.1s,transform 0.08s;touch-action:manipulation;display:block;width:100%;}
.lp-btn:active{filter:brightness(1.8);transform:scale(0.88);}
/* SOUND SETTINGS */
.sound-opt{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.85rem 1rem;cursor:pointer;transition:border-color 0.15s;}
.sound-opt.active{border-color:var(--accent);background:rgba(var(--aRGB),0.08);}
/* LIST */
.list-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.75rem 0.85rem;display:flex;flex-direction:column;gap:0.25rem;cursor:pointer;transition:border-color 0.15s;}
.list-item:active{border-color:var(--accent);}
.li-cat{font-size:0.59rem;color:var(--accent);font-weight:500;letter-spacing:0.06em;text-transform:uppercase;}
.li-title{font-size:0.86rem;font-weight:500;color:var(--text);}
.li-desc{font-size:0.7rem;color:var(--muted2);line-height:1.5;font-weight:300;}
/* EDITOR */
.ed-sec{display:flex;flex-direction:column;gap:0.38rem;}
.ed-lbl{font-size:0.6rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.82rem;padding:0.6rem 0.8rem;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:72px;line-height:1.55;}
.img-up{width:100%;min-height:62px;border-radius:10px;border:1px dashed rgba(var(--aRGB),0.3);display:flex;align-items:center;justify-content:center;gap:0.28rem;color:var(--muted);font-size:0.74rem;cursor:pointer;padding:0.75rem;text-align:center;}
.img-prev{width:100%;height:88px;object-fit:cover;border-radius:8px;display:none;}
.img-prev.visible{display:block;}
.ed-act{display:flex;gap:0.42rem;margin-top:0.12rem;}
.btn-save{flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;padding:0.72rem;cursor:pointer;width:auto;}
.btn-cancel{flex:0;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:0.82rem;padding:0.72rem 0.82rem;cursor:pointer;width:auto;}
.divider{height:1px;background:var(--border);margin:0.1rem 0;}
.ex-item{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:0.65rem 0.75rem;display:flex;align-items:center;gap:0.55rem;}
.ex-text{flex:1;}.ex-title{font-size:0.78rem;font-weight:500;color:var(--text);}.ex-cat{font-size:0.62rem;color:var(--muted);margin-top:0.08rem;}
.ex-acts{display:flex;gap:0.26rem;flex-shrink:0;}
.ib{border:none;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;width:auto;padding:0.22rem 0.38rem;}
.ib.edit{background:rgba(129,140,248,0.15);color:var(--accent2);}
.ib.del{background:rgba(248,113,113,0.12);color:var(--danger);}
.ib svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.farb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.55rem;}
.f-sw{width:100%;aspect-ratio:1;border-radius:12px;border:3px solid transparent;cursor:pointer;transition:transform 0.12s,border-color 0.15s;display:flex;align-items:center;justify-content:center;}
.f-sw:active{transform:scale(0.93);}
.f-sw.active{border-color:#fff;}
.f-sw svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:none;}
.f-sw.active svg{display:block;}
.f-nm{font-size:0.62rem;color:var(--muted);text-align:center;margin-top:0.2rem;}
/* GAMES */
.snake-controls{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:3px;}
.sk-btn{width:44px;height:44px;border:none;border-radius:8px;background:var(--surface2);color:var(--text);font-size:0.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sk-btn:active{background:var(--accent);color:#fff;}
.qt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0.35rem;width:100%;max-width:290px;}
.qt-btn{aspect-ratio:1;border-radius:13px;border:none;cursor:pointer;transition:filter 0.1s,transform 0.08s;}
.qt-btn.lit{filter:brightness(1.5);transform:scale(1.06);}
.tap-c{width:200px;height:200px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;transition:transform 0.08s;box-shadow:0 0 60px rgba(var(--aRGB),0.5);cursor:pointer;user-select:none;-webkit-user-select:none;}
.tap-c:active{transform:scale(0.9);}
.tap-cnt{font-family:'DM Serif Display',serif;font-size:2.8rem;color:var(--text);}
.pop-bubble{border-radius:50%;cursor:pointer;transition:transform 0.12s;border:none;touch-action:manipulation;}
.draw-tools{display:flex;gap:0.45rem;align-items:center;flex-wrap:wrap;padding:0.45rem 0.7rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.d-col{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.1s;flex-shrink:0;}
.d-col.active{border-color:#fff;transform:scale(1.2);}
.d-sz{font-size:0.67rem;color:var(--muted2);display:flex;align-items:center;gap:0.28rem;margin-left:auto;}
.d-sz input{width:72px;accent-color:var(--accent);}
.d-clr{background:rgba(248,113,113,0.15);color:var(--danger);border:none;border-radius:7px;padding:0.28rem 0.6rem;font-size:0.68rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
.geo-controls{display:flex;flex-direction:column;gap:0.45rem;padding:0.65rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.geo-row{display:flex;align-items:center;gap:0.45rem;font-size:0.68rem;color:var(--muted2);}
.geo-row input{flex:1;accent-color:var(--accent);}
.geo-row span{min-width:85px;}
.konfetti-tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.65rem;cursor:pointer;}
/* SENSO */
.senso-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px;}
.senso-btn{aspect-ratio:1;border-radius:16px;border:none;cursor:pointer;transition:filter 0.1s,transform 0.08s;touch-action:manipulation;}
.senso-btn:active{transform:scale(0.95);}
.senso-btn.flash{filter:brightness(2.5);}
/* REACTION */
.react-time{font-family:'DM Serif Display',serif;font-size:2.5rem;color:var(--accent);text-align:center;}
/* TIC TAC TOE */
.ttt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:240px;height:240px;}
.ttt-cell{background:var(--surface2);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;cursor:pointer;transition:background 0.15s;}
.ttt-cell:active{background:rgba(var(--aRGB),0.2);}
/* ZAHLENFOLGE */
.num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0.5rem;width:100%;max-width:340px;}
.num-btn{aspect-ratio:1;border-radius:10px;border:none;font-family:'DM Serif Display',serif;font-size:1.1rem;cursor:pointer;transition:background 0.1s,transform 0.08s;touch-action:manipulation;}
.num-btn:active{transform:scale(0.92);}
.num-btn.done{background:rgba(var(--aRGB),0.2);color:var(--accent);border:1px solid rgba(var(--aRGB),0.4);}
.num-btn.wrong{background:rgba(248,113,113,0.3);color:var(--danger);}
/* TETRIS */
#tetrisC{display:block;border-radius:8px;}
.tetris-side{display:flex;flex-direction:column;gap:0.5rem;align-items:center;}
.tetris-next{width:60px;height:60px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);}
/* METRONOM */
.metro-body{position:relative;width:140px;height:185px;}
.metro-box{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:110px;height:120px;background:var(--surface2);border-radius:10px 10px 5px 5px;border:1px solid var(--border);}
.metro-stick{position:absolute;bottom:76px;left:50%;width:4px;height:135px;background:var(--accent);transform-origin:bottom center;border-radius:2px;margin-left:-2px;}
.metro-weight{position:absolute;width:18px;height:12px;background:var(--accent);border-radius:4px;left:50%;transform:translateX(-50%);top:9px;}
/* FAKE MESSENGER */
.msg-wrap{display:flex;flex-direction:column;height:100%;width:100%;background:var(--bg);}
.msg-list{flex:1;overflow-y:auto;padding:0.75rem;display:flex;flex-direction:column;gap:0.5rem;-webkit-overflow-scrolling:touch;}
.msg-bubble{max-width:75%;padding:0.55rem 0.85rem;border-radius:18px;font-size:0.85rem;line-height:1.45;animation:msgSlideIn 0.3s ease;}
.msg-bubble.out,.msg-bubble.sent{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg-bubble.in,.msg-bubble.recv{background:var(--surface2);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;}
@keyframes msgSlideIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgFlyUp{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-60px);}}
.msg-fly{animation:msgFlyUp 0.5s ease forwards;}
.msg-input-row{display:flex;gap:0.5rem;padding:0.65rem;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.msg-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:22px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.85rem;padding:0.6rem 1rem;outline:none;resize:none;max-height:80px;overflow-y:auto;}
.msg-input:focus{border-color:var(--accent);}
.msg-send{width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* HOT SPOT */
.hotspot-area{position:absolute;inset:0;touch-action:none;cursor:crosshair;}
.hotspot-indicator{position:absolute;pointer-events:none;border-radius:50%;transition:none;}
/* SSP */
.ssp-btns{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;}
.ssp-btn{width:90px;height:90px;border-radius:18px;border:2px solid var(--border);background:var(--surface2);font-size:2.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 0.15s,transform 0.1s;}
.ssp-btn:active{transform:scale(0.92);border-color:var(--accent);}
.ssp-result{font-family:'DM Serif Display',serif;font-size:1.4rem;text-align:center;}
.ssp-sub{font-size:0.78rem;color:var(--muted);text-align:center;}
/* TEXT ADVENTURE */
.adv-wrap{display:flex;flex-direction:column;height:100%;width:100%;padding:1rem;}
.adv-story{flex:1;overflow-y:auto;font-size:0.88rem;line-height:1.7;color:var(--text);margin-bottom:0.75rem;-webkit-overflow-scrolling:touch;}
.adv-story p{margin-bottom:0.5rem;}
.adv-story .new{color:var(--accent2);}
.adv-choices{display:flex;flex-direction:column;gap:0.4rem;flex-shrink:0;}
.adv-choice{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.7rem 0.9rem;font-size:0.82rem;color:var(--text);cursor:pointer;text-align:left;transition:border-color 0.15s;}
.adv-choice:active{border-color:var(--accent);}
.karten-flip{perspective:800px;width:100%;max-width:280px;height:360px;margin:0 auto;cursor:pointer;}
.karten-flip-inner{position:relative;width:100%;height:100%;transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);transform-style:preserve-3d;}
.karten-flip.flipped .karten-flip-inner{transform:rotateY(180deg);}
.karten-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.75rem;padding:1.2rem;}
.karten-back{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);}
.karten-front{background:linear-gradient(160deg,var(--surface) 0%,var(--surface2) 100%);border:2px solid rgba(var(--aRGB),0.4);transform:rotateY(180deg);}
@keyframes spin{to{transform:rotate(360deg);}}

/* KARTEN SPREADS */
.karte-slot{perspective:600px;cursor:pointer;}
.karte-inner{position:relative;width:100%;height:100%;transition:transform 0.55s cubic-bezier(0.4,0,0.2,1);transform-style:preserve-3d;}
.karte-slot.revealed .karte-inner{transform:rotateY(180deg);}
.karte-slot.reversed .karte-inner{transform:rotateY(180deg) rotate(180deg);}
.karte-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.3rem;padding:0.4rem;}
.karte-back-face{background:var(--surface2);border:1px solid rgba(var(--aRGB),0.3);}
.karte-back-pattern{font-size:1.4rem;opacity:0.4;}
.karte-front-face{background:var(--surface);border:2px solid rgba(var(--aRGB),0.5);transform:rotateY(180deg);}
.karte-front-face.reversed-face{transform:rotateY(180deg) rotate(180deg);}
.karte-slot-label{font-size:0.52rem;color:var(--muted);text-align:center;margin-top:0.25rem;letter-spacing:0.05em;}
.toast{position:fixed;bottom:4.2rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:0.4rem 0.95rem;font-size:0.74rem;color:var(--text);opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;white-space:nowrap;z-index:300;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-state{text-align:center;color:var(--muted);font-size:0.78rem;padding:1.2rem 0;line-height:1.6;}
</style>
<style>
.skill-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:0.4rem;cursor:pointer;transition:border-color 0.15s,transform 0.12s;}
.skill-card:active{border-color:var(--accent);transform:scale(0.98);}
.skill-cat-label{font-size:0.6rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);}
.skill-title{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--text);}
.skill-sub{font-size:0.75rem;color:var(--muted2);line-height:1.5;}
</style>
</head>
<body style="display:flex;flex-direction:column;height:100dvh;overflow:hidden;">

<div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;">
  <button onclick="goHome()" style="background:var(--surface2);border:1px solid var(--border);border-radius:100px;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:500;cursor:pointer;padding:0.35rem 0.75rem;display:flex;align-items:center;gap:0.4rem;">
    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Start
  </button>
  <div style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--text);">🧩 Skills</div>
</div>

<div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem;display:flex;flex-direction:column;gap:0.6rem;" id="skillsList">
  <div style="text-align:center;color:var(--muted);font-size:0.82rem;padding:2rem 1rem;line-height:1.7;">
    🚧 Hier entstehen die DBT-Skills.<br>Dieser Chat baut die Inhalte auf.
  </div>
</div>

<!-- Vorbereitetes Overlay-System für einzelne Skill-Detailansichten -->
<div class="overlay" id="ov-skill-detail">
  <div class="ov-hdr">
    <div class="ov-title" id="skillDetailTitle">Skill</div>
    <button class="ov-close" onclick="closeSkillDetail()">✕</button>
  </div>
  <div class="ov-body" style="align-items:stretch;padding:1.2rem;overflow-y:auto;" id="skillDetailBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function beep(freq=600,dur=0.06,vol=0.14,type='square'){try{const c=gCtx();if(c.state==='suspended')c.resume();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);o.start();o.stop(c.currentTime+dur+0.01);}catch(e){}}
let audioCtx=null;
function gCtx(){if(!audioCtx||audioCtx.state==='closed')audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms||22);}catch(e){}}

function openSkillDetail(title,html){
  document.getElementById('skillDetailTitle').textContent=title;
  document.getElementById('skillDetailBody').innerHTML=html;
  document.getElementById('ov-skill-detail').classList.add('active');
}
function closeSkillDetail(){
  document.getElementById('ov-skill-detail').classList.remove('active');
}
window.openSkillDetail=openSkillDetail;
window.closeSkillDetail=closeSkillDetail;

function goHome(){
  if(window.parent!==window){window.parent.postMessage('closeFrame','*');}
  else window.location.href='index.html';
}
window.goHome=goHome;

// Akzentfarbe aus der Haupt-App übernehmen
try{
  const FARBEN=[{h:'#c084fc',h2:'#818cf8',rgb:'192,132,252'},{h:'#f472b6',h2:'#e879f9',rgb:'244,114,182'},{h:'#f87171',h2:'#fb923c',rgb:'248,113,113'},{h:'#fb923c',h2:'#fbbf24',rgb:'251,146,60'},{h:'#fbbf24',h2:'#a3e635',rgb:'251,191,36'},{h:'#4ade80',h2:'#2dd4bf',rgb:'74,222,128'},{h:'#2dd4bf',h2:'#38bdf8',rgb:'45,212,191'},{h:'#60a5fa',h2:'#818cf8',rgb:'96,165,250'},{h:'#818cf8',h2:'#a78bfa',rgb:'129,140,248'},{h:'#e2e8f0',h2:'#cbd5e1',rgb:'226,232,240'},{h:'#f59e0b',h2:'#fbbf24',rgb:'245,158,11'},{h:'#fb7185',h2:'#f472b6',rgb:'251,113,133'}];
  const saved=localStorage.getItem('pfv1');
  if(saved!==null){
    const f=FARBEN[parseInt(saved)]||FARBEN[5];
    document.documentElement.style.setProperty('--accent',f.h);
    document.documentElement.style.setProperty('--accent2',f.h2);
    document.documentElement.style.setProperty('--aRGB',f.rgb);
  }
}catch(e){}
</script>
</body>
</html>
