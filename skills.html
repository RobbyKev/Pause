<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pause – Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#12121f;--surface:#1c1c2e;--surface2:#242438;--border:rgba(255,255,255,0.07);--accent:#4ade80;--accent2:#2dd4bf;--text:#f1f0f5;--muted:#6b6b8a;--muted2:#9898b8;--danger:#f87171;--aRGB:74,222,128;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;height:100dvh;}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:600;display:none;flex-direction:column;}
.overlay.active{display:flex;}
.ov-hdr{display:flex;align-items:center;justify-content:space-between;gap:0.6rem;padding:0.75rem 0.95rem;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.ov-title{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--text);line-height:1.2;}
.ov-close{background:transparent;border:none;color:var(--muted2);font-size:1.3rem;cursor:pointer;padding:0.12rem 0.3rem;line-height:1;flex-shrink:0;}
.ov-body{flex:1;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;background:var(--bg);}
.btn{border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.86rem;font-weight:500;cursor:pointer;padding:0.8rem 0.95rem;transition:transform 0.1s,opacity 0.1s;width:100%;}
.btn:active{transform:scale(0.97);opacity:0.82;}
.btn-p{background:var(--accent);color:#12121f;font-weight:600;}
.btn-g{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted2);}
input[type=text],textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.86rem;padding:0.7rem 0.85rem;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
input[type=text]:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:80px;line-height:1.6;}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:0.45rem 1rem;font-size:0.75rem;color:var(--text);opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;white-space:nowrap;z-index:900;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- FILTER ---------- */
.filter-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1rem 1.1rem 1.15rem;display:flex;flex-direction:column;gap:0.7rem;}
.filter-top{display:flex;align-items:baseline;justify-content:space-between;gap:0.5rem;}
.filter-lbl{font-size:0.62rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.filter-val{font-family:'DM Serif Display',serif;font-size:1.9rem;color:var(--accent);line-height:1;}
.filter-state{font-size:0.72rem;color:var(--muted2);line-height:1.45;}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:100px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;border:3px solid var(--accent);cursor:pointer;}
input[type=range]::-moz-range-track{height:6px;border-radius:100px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;}
.scale-marks{display:flex;justify-content:space-between;font-size:0.6rem;color:var(--muted);margin-top:-0.35rem;}
.filter-toggle{display:flex;gap:0.35rem;}
.ftog{flex:1;padding:0.4em 0.6em;border-radius:100px;font-size:0.7rem;font-weight:500;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted2);cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
.ftog.active{background:rgba(var(--aRGB),0.12);border-color:var(--accent);color:var(--accent);}

/* ---------- LISTE ---------- */
.kat-head{font-size:0.6rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:0.6rem 0.15rem 0.1rem;}
.skill-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:0.95rem 1rem;display:flex;align-items:flex-start;gap:0.8rem;cursor:pointer;transition:border-color 0.15s,transform 0.12s;}
.skill-card:active{border-color:var(--accent);transform:scale(0.985);}
.skill-ic{width:40px;height:40px;border-radius:12px;background:rgba(var(--aRGB),0.13);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0;}
.skill-body{flex:1;min-width:0;}
.skill-title{font-family:'DM Serif Display',serif;font-size:1.02rem;color:var(--text);line-height:1.25;}
.skill-sub{font-size:0.73rem;color:var(--muted2);line-height:1.5;margin-top:0.18rem;font-weight:300;}
.skill-meta{display:flex;align-items:center;gap:0.4rem;margin-top:0.45rem;}
.range-pill{font-size:0.58rem;letter-spacing:0.04em;color:var(--accent);background:rgba(var(--aRGB),0.1);border-radius:100px;padding:0.18em 0.6em;font-weight:500;}
.dauer-pill{font-size:0.58rem;color:var(--muted);}
.empty-state{text-align:center;color:var(--muted);font-size:0.8rem;padding:2rem 1rem;line-height:1.7;}

/* ---------- SCHRITT-ENGINE ---------- */
.st-wrap{width:100%;max-width:540px;margin:0 auto;padding:1.1rem 1rem 1.4rem;display:flex;flex-direction:column;gap:1rem;flex:1;}
.st-prog{height:4px;border-radius:100px;background:rgba(255,255,255,0.07);overflow:hidden;flex-shrink:0;}
.st-bar{height:100%;background:var(--accent);border-radius:100px;transition:width 0.35s cubic-bezier(0.4,0,0.2,1);}
.st-count{font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.st-main{flex:1;display:flex;flex-direction:column;gap:0.85rem;}
.st-h{font-family:'DM Serif Display',serif;font-size:1.45rem;line-height:1.3;color:var(--text);}
.st-p{font-size:0.88rem;color:var(--muted2);line-height:1.7;font-weight:300;}
.st-li{display:flex;flex-direction:column;gap:0.45rem;margin-top:0.15rem;}
.st-li-item{display:flex;gap:0.6rem;font-size:0.83rem;color:var(--muted2);line-height:1.55;font-weight:300;}
.st-li-dot{color:var(--accent);flex-shrink:0;font-weight:600;}
.st-note{font-size:0.72rem;color:var(--muted);line-height:1.6;background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:0.65rem 0.8rem;}
.st-nav{display:flex;gap:0.45rem;flex-shrink:0;padding-top:0.3rem;}
.st-nav .btn-g{width:auto;flex:0 0 auto;padding:0.8rem 1.1rem;}
/* Timer */
.tm-wrap{display:flex;flex-direction:column;align-items:center;gap:0.9rem;padding:0.5rem 0;}
.tm-ring{position:relative;width:150px;height:150px;}
.tm-ring svg{transform:rotate(-90deg);width:150px;height:150px;}
.tm-track{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:6;}
.tm-fill{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.tm-val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'DM Serif Display',serif;font-size:2.1rem;color:var(--text);}
.tm-btns{display:flex;gap:0.4rem;}
.tm-b{border:none;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.74rem;font-weight:500;cursor:pointer;padding:0.4rem 1rem;background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--muted2);}
.tm-b.prim{background:var(--accent);color:#12121f;border-color:var(--accent);font-weight:600;}
/* Atem */
.at-wrap{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.4rem 0 0.6rem;}
.at-c{width:120px;height:120px;border-radius:50%;background:rgba(var(--aRGB),0.12);border:2px solid rgba(var(--aRGB),0.28);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent);font-family:'DM Serif Display',serif;transition:transform 1s ease-in-out,background 1s,border-color 1s;}
.at-lbl{font-family:'DM Serif Display',serif;font-size:1.35rem;color:var(--text);}
.at-sub{font-size:0.73rem;color:var(--muted);}
/* Check */
.ck-item{display:flex;align-items:center;gap:0.7rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.75rem 0.85rem;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.ck-item.on{border-color:var(--accent);background:rgba(var(--aRGB),0.09);}
.ck-box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.7rem;color:#12121f;}
.ck-item.on .ck-box{background:var(--accent);border-color:var(--accent);}
.ck-txt{font-size:0.82rem;color:var(--text);line-height:1.45;}
/* Skala */
.sk-val{font-family:'DM Serif Display',serif;font-size:2.6rem;color:var(--accent);text-align:center;line-height:1;}
/* Zusammenfassung */
.zf-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem;font-size:0.86rem;line-height:1.75;color:var(--text);white-space:pre-wrap;font-weight:300;}
.zf-lbl{font-size:0.6rem;letter-spacing:0.07em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:0.15rem;display:block;}
.zf-blk{margin-bottom:0.85rem;}
.zf-blk:last-child{margin-bottom:0;}
.done-ic{font-size:2.6rem;text-align:center;}

/* ---------- SPIELE ---------- */
.kat-info{font-size:0.7rem;color:var(--muted);line-height:1.5;padding:0 0.15rem 0.35rem;font-weight:300;}
.gm-wrap{display:flex;flex-direction:column;height:100%;width:100%;max-width:540px;margin:0 auto;padding:0.9rem 1rem 1.2rem;gap:0.7rem;}
.gm-top{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-shrink:0;}
.gm-stat{font-size:0.66rem;color:var(--muted);letter-spacing:0.03em;}
.gm-lvl{font-size:0.62rem;color:var(--accent);background:rgba(var(--aRGB),0.1);border-radius:100px;padding:0.22em 0.7em;font-weight:500;flex-shrink:0;}
.gm-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;min-height:0;position:relative;width:100%;}
.gm-stage.voll{align-items:stretch;justify-content:stretch;gap:0;}
.gm-hint{font-size:0.76rem;color:var(--muted2);text-align:center;line-height:1.5;min-height:2.3em;flex-shrink:0;}
.gm-foot{display:flex;gap:0.45rem;flex-shrink:0;}
.gm-anleitung{display:flex;flex-direction:column;gap:0.85rem;align-items:center;text-align:center;}
.gm-anl-ic{font-size:2.8rem;}
.gm-anl-t{font-family:'DM Serif Display',serif;font-size:1.45rem;line-height:1.25;}
.gm-anl-p{font-size:0.86rem;color:var(--muted2);line-height:1.7;font-weight:300;max-width:360px;}
.gm-q{font-family:'DM Serif Display',serif;font-size:2.9rem;text-align:center;line-height:1.15;letter-spacing:0.02em;}
.gm-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:0.6rem;width:100%;max-width:320px;}
.gm-opt{border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;font-size:1.15rem;font-weight:500;cursor:pointer;transition:transform 0.08s,border-color 0.15s,background 0.15s;display:flex;align-items:center;justify-content:center;padding:0.95rem 0.5rem;touch-action:manipulation;}
.gm-opt:active{transform:scale(0.95);}
.gm-opt.gut{border-color:var(--accent);background:rgba(var(--aRGB),0.18);color:var(--accent);}
.gm-opt.falsch{border-color:var(--danger);opacity:0.45;}
.gm-farben{display:grid;grid-template-columns:repeat(3,1fr);gap:0.7rem;width:100%;max-width:250px;}
.gm-farbe{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,0.08);cursor:pointer;transition:transform 0.08s,box-shadow 0.15s;touch-action:manipulation;}
.gm-farbe:active{transform:scale(0.9);}
.gm-farbe.gut{box-shadow:0 0 0 3px #fff;}
.gm-pad{width:100%;max-width:300px;min-height:120px;border-radius:20px;border:2px solid rgba(var(--aRGB),0.35);background:rgba(var(--aRGB),0.1);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform 0.06s,background 0.1s;text-align:center;padding:1rem;}
.gm-pad.an{transform:scale(0.97);background:rgba(var(--aRGB),0.3);}
.gm-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:290px;}
.gm-cell{aspect-ratio:1;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:transform 0.08s,background 0.12s,border-color 0.12s;touch-action:manipulation;}
.gm-cell.an{background:var(--accent);border-color:var(--accent);transform:scale(1.06);}
.gm-cell.miss{border-color:var(--danger);}
.gm-tiles{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;max-width:340px;}
.gm-tile{width:54px;height:54px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.55rem;cursor:pointer;transition:transform 0.08s,border-color 0.15s,background 0.15s;touch-action:manipulation;}
.gm-tile:active{transform:scale(0.92);}
.gm-tile.gut{border-color:var(--accent);background:rgba(var(--aRGB),0.2);}
.gm-tile.falsch{border-color:var(--danger);opacity:0.5;}
.gm-drums{display:flex;gap:0.5rem;width:100%;max-width:320px;}
.gm-drum{flex:1;border-radius:16px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.3rem;font-size:1.6rem;cursor:pointer;transition:transform 0.07s,background 0.1s,border-color 0.1s;touch-action:manipulation;padding:1.4rem 0.4rem;}
.gm-drum span{font-size:0.6rem;color:var(--muted);letter-spacing:0.05em;}
.gm-drum.an{background:rgba(var(--aRGB),0.28);border-color:var(--accent);transform:scale(0.95);}
.gm-morse{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;min-height:2.2rem;align-items:center;}
.gm-sym{font-family:'DM Serif Display',serif;font-size:1.9rem;color:var(--accent);line-height:1;transition:color 0.12s,transform 0.12s;}
.gm-sym.leer{color:rgba(255,255,255,0.13);}
.gm-sym.jetzt{transform:scale(1.35);color:#fff;}
.gm-sym.live{opacity:0.55;}
.mo-row{display:flex;align-items:center;gap:0.7rem;width:100%;max-width:330px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.5rem 0.75rem;}
.mo-lbl{font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);width:54px;flex-shrink:0;}
.mo-row .gm-morse{flex:1;justify-content:flex-start;min-height:2rem;}
.gm-slider-wrap{width:100%;max-width:320px;display:flex;flex-direction:column;gap:0.4rem;}
.gm-big{font-family:'DM Serif Display',serif;font-size:3.2rem;color:var(--accent);text-align:center;line-height:1;}
.gm-mid{font-family:'DM Serif Display',serif;font-size:1.6rem;text-align:center;line-height:1.3;}
.gm-canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:14px;}
.gm-key{display:flex;gap:0.9rem;justify-content:center;flex-wrap:wrap;font-size:0.9rem;color:var(--muted2);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.6rem 0.8rem;}
.gm-key-item{display:flex;align-items:center;gap:0.32rem;}
.gm-key-dot{width:15px;height:15px;border-radius:50%;display:inline-block;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.shake{animation:shake 0.32s;}

/* Raster, Birnen, Zähler, Räder */
.gm-stage.roll{justify-content:flex-start;overflow-y:auto;padding:0.2rem 0;-webkit-overflow-scrolling:touch;}
.gm-raster{display:grid;gap:4px;width:100%;max-width:320px;margin:0 auto;flex-shrink:0;}
.gm-zelle{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-family:'DM Serif Display',serif;color:var(--text);line-height:1;transition:transform 0.08s,border-color 0.15s,background 0.15s;overflow:hidden;touch-action:manipulation;}
.gm-zelle:active{transform:scale(0.9);}
.gm-zelle.gut{border-color:var(--accent);background:rgba(var(--aRGB),0.25);color:var(--accent);}
.gm-zelle.falsch{border-color:var(--danger);}
.gm-birnen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:250px;}
.gm-birne{aspect-ratio:1;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:background 0.2s,border-color 0.2s,box-shadow 0.25s,transform 0.08s,filter 0.2s;filter:grayscale(1) brightness(0.55);touch-action:manipulation;}
.gm-birne:active{transform:scale(0.93);}
.gm-birne.an{filter:none;background:rgba(var(--aRGB),0.18);border-color:var(--accent);box-shadow:0 0 18px rgba(var(--aRGB),0.35);}
.gm-zaehler{display:flex;align-items:center;gap:1rem;justify-content:center;flex-shrink:0;}
.gm-zbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;touch-action:manipulation;transition:transform 0.08s;}
.gm-zbtn:active{transform:scale(0.9);}
.gm-zwert{font-family:'DM Serif Display',serif;font-size:2.5rem;color:var(--accent);min-width:74px;text-align:center;line-height:1;}
.gm-raeder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px;}
.gm-rad{aspect-ratio:1;border-radius:50%;border:2px solid var(--border);background:var(--surface);position:relative;cursor:pointer;overflow:hidden;touch-action:manipulation;transition:border-color 0.15s,box-shadow 0.15s;}
.gm-rad-in{position:absolute;inset:0;animation-name:drehen;animation-timing-function:linear;animation-iteration-count:infinite;}
.gm-rad-in::before{content:'';position:absolute;top:9%;left:50%;width:22%;height:22%;margin-left:-11%;border-radius:50%;background:var(--accent);}
.gm-rad-in::after{content:'';position:absolute;top:20%;bottom:50%;left:50%;width:2px;margin-left:-1px;background:rgba(var(--aRGB),0.3);}
.gm-rad.gut{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.gm-rad.falsch{border-color:var(--danger);}
@keyframes drehen{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="ov-hdr">
  <div style="display:flex;align-items:center;gap:0.75rem;min-width:0;">
    <button onclick="goHome()" style="background:var(--surface2);border:1px solid var(--border);border-radius:100px;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:500;cursor:pointer;padding:0.35rem 0.75rem;display:flex;align-items:center;gap:0.4rem;flex-shrink:0;">
      <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Start
    </button>
    <div style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--text);">🧩 Skills</div>
  </div>
</div>

<div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem 2.5rem;display:flex;flex-direction:column;gap:0.55rem;">
  <div class="filter-box">
    <div class="filter-top">
      <div class="filter-lbl">Anspannung gerade</div>
      <div class="filter-val" id="lvlVal">5</div>
    </div>
    <input type="range" min="0" max="10" step="1" value="5" id="lvlSlider">
    <div class="scale-marks"><span>0 ruhig</span><span>5</span><span>10 Hochstress</span></div>
    <div class="filter-state" id="lvlState"></div>
    <div class="filter-toggle">
      <button class="ftog active" id="tgFilter" onclick="setModus(true)">Passend zu mir</button>

/* --- Hilfen --- */
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ton(f,dur,typ,vol){beep(f,dur,vol||0.1,typ||'sine');}
function rausch(dur,vol,typ){
  try{const c=gCtx();const len=Math.max(1,Math.floor(c.sampleRate*dur));const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type=typ==='hat'?'highpass':'bandpass';f.frequency.value=typ==='hat'?7000:1900;
  const g=c.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();}catch(e){}
}
function kick(){try{const c=gCtx();const o=c.createOscillator(),g=c.createGain();o.type='sine';
  o.frequency.setValueAtTime(155,c.currentTime);o.frequency.exponentialRampToValueAtTime(45,c.currentTime+0.22);
  g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.25);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.28);}catch(e){}}
let PO=null;
function poStart(f){poStop();try{const c=gCtx();if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=f;g.gain.value=0.001;o.connect(g);g.connect(c.destination);o.start();
  g.gain.setTargetAtTime(0.1,c.currentTime,0.02);PO={o:o,g:g};}catch(e){}}
function poSet(f){if(PO)try{PO.o.frequency.setTargetAtTime(f,gCtx().currentTime,0.015);}catch(e){}}
function poStop(){if(!PO)return;const p=PO;PO=null;try{p.g.gain.setTargetAtTime(0,gCtx().currentTime,0.03);setTimeout(()=>{try{p.o.stop();}catch(e){}},180);}catch(e){}}

/* --- Spiel-Rahmen --- */
let GAME=null;
function gClear(){
  if(!GAME)return;
  (GAME.iv||[]).forEach(clearInterval);
  (GAME.to||[]).forEach(clearTimeout);
  if(GAME.raf)cancelAnimationFrame(GAME.raf);
  GAME.iv=[];GAME.to=[];GAME.raf=null;
}
function stopGame(){gClear();poStop();GAME=null;}
function gI(fn,ms){if(!GAME)return;const i=setInterval(fn,ms);GAME.iv.push(i);return i;}
function gT(fn,ms){if(!GAME)return;const t=setTimeout(()=>{if(GAME)fn();},ms);GAME.to.push(t);return t;}
function gStat(){
  if(!GAME)return;
  const s=document.getElementById('gmStat');
  if(s)s.textContent='Runde '+GAME.runde+' · '+GAME.ok+' geschafft';
  const l=document.getElementById('gmLvl');
  if(l)l.textContent='Stufe '+GAME.stufe;
}
function gHint(t){const h=document.getElementById('gmHint');if(h)h.textContent=t;}
function gGut(){
  if(!GAME)return;
  GAME.ok++;GAME.streak++;GAME.miss=0;
  if(GAME.streak>=3&&GAME.stufe<8){GAME.stufe++;GAME.streak=0;}
  beep(760,0.13,0.09,'sine');vib(14);gStat();
}
function gNaja(){
  if(!GAME)return;
  GAME.streak=0;GAME.miss=(GAME.miss||0)+1;
  if(GAME.miss>=2&&GAME.stufe>1){GAME.stufe--;GAME.miss=0;}
  beep(280,0.18,0.07,'sine');gStat();
}
function startGame(id){
  const g=GAMES.find(x=>x.id===id);
  if(!g)return;
  stopGame();stopTimers();RUN=null;
  GAME={g:g,iv:[],to:[],raf:null,stufe:1,runde:0,ok:0,streak:0,miss:0,sperre:false};
  openSkillDetail(g.titel,'<div class="gm-wrap" id="gmWrap"></div>');
  document.getElementById('gmWrap').innerHTML=
    '<div class="gm-stage"><div class="gm-anleitung"><div class="gm-anl-ic">'+g.icon+'</div>'
    +'<div class="gm-anl-t">'+esc(g.anl.t)+'</div><div class="gm-anl-p">'+esc(g.anl.p)+'</div></div></div>'
    +'<div class="gm-hint">Hier kann man nichts verlieren und nichts falsch machen. Hör auf, wann du willst.</div>'
    +'<div class="gm-foot"><button class="btn btn-p" onclick="losGehts()">Los geht\'s</button></div>';
}
function losGehts(){
  if(!GAME)return;
  document.getElementById('gmWrap').innerHTML=
    '<div class="gm-top"><div class="gm-stat" id="gmStat">Runde 0 · 0 geschafft</div><div class="gm-lvl" id="gmLvl">Stufe 1</div></div>'
    +'<div class="gm-stage" id="gmStage"></div>'
    +'<div class="gm-hint" id="gmHint"></div>'
    +'<div class="gm-foot"><button class="btn btn-g" onclick="closeSkillDetail()">Beenden</button></div>';
  try{const c=gCtx();if(c.state==='suspended')c.resume();}catch(e){}
  const f=SPIEL_START[GAME.g.id];
  if(f)f();
}
window.startGame=startGame;window.losGehts=losGehts;

/* --- 1. Farbkreislauf --- */
const SPF=[['Rot','#f87171'],['Blau','#60a5fa'],['Grün','#4ade80'],['Gelb','#fbbf24'],['Lila','#c084fc'],['Orange','#fb923c']];
function stroopStart(){stroopRunde();}
function stroopRunde(){
  if(!GAME)return;
  GAME.runde++;gStat();GAME.sperre=false;
  const n=Math.min(3+Math.floor((GAME.stufe-1)/2),6);
  const wort=rnd(n);let tinte=rnd(n);
  while(tinte===wort)tinte=rnd(n);
  const nachTinte=GAME.stufe<5?true:(Math.random()<0.5);
  GAME.loesung=nachTinte?tinte:wort;
  let h='<div class="gm-q" id="stroopWort" style="color:'+SPF[tinte][1]+'">'+SPF[wort][0].toUpperCase()+'</div><div class="gm-farben">';
  for(let i=0;i<n;i++)h+='<div class="gm-farbe" data-i="'+i+'" style="background:'+SPF[i][1]+'" onclick="stroopTipp('+i+')"></div>';
  h+='</div>';
  document.getElementById('gmStage').innerHTML=h;
  gHint(nachTinte?'Tippe die Farbe, in der das Wort geschrieben ist.':'Umgekehrt: tippe die Farbe, die das Wort bedeutet.');
}
function stroopTipp(i){
  if(!GAME||GAME.sperre)return;GAME.sperre=true;
  const richtig=i===GAME.loesung;
  const els=document.querySelectorAll('.gm-farbe');
  if(els[GAME.loesung])els[GAME.loesung].classList.add('gut');
  if(richtig)gGut();
  else{gNaja();const w=document.getElementById('stroopWort');if(w)w.classList.add('shake');}
  gT(stroopRunde,richtig?420:1050);
}
window.stroopTipp=stroopTipp;

/* --- 2. Seifenblasen-Pop --- */
function bubStart(){
  const st=document.getElementById('gmStage');
  st.classList.add('voll');
  st.innerHTML='<canvas class="gm-canvas" id="gmC"></canvas>';
  gHint('Tippe die Blasen an. Verpasste steigen einfach weiter.');
  const cv=document.getElementById('gmC');
  const r=cv.getBoundingClientRect();
  const W=Math.max(r.width||300,160),H=Math.max(r.height||360,200);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const cx=cv.getContext('2d');
  if(cx)cx.scale(dpr,dpr);
  GAME.bub=[];GAME.W=W;GAME.H=H;
  const spawn=()=>{
    if(!GAME)return;
    const anz=1+Math.floor(GAME.stufe/3);
    for(let k=0;k<anz;k++){
      const rr=15+Math.random()*22;
      GAME.bub.push({x:rr+Math.random()*Math.max(1,W-2*rr),y:H+rr,r:rr,vy:(0.4+Math.random()*0.5)*(1+GAME.stufe*0.1),hue:Math.random()*360,ph:Math.random()*6.3});
    }
  };
  spawn();
  gI(spawn,Math.max(430,1300-GAME.stufe*90));
  const loop=()=>{
    if(!GAME||!cx)return;
    cx.clearRect(0,0,W,H);
    GAME.bub=GAME.bub.filter(b=>b.y+b.r>-12);
    GAME.bub.forEach(b=>{
      b.y-=b.vy;b.ph+=0.03;b.x+=Math.sin(b.ph)*0.45;
      const g=cx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.1,b.x,b.y,b.r);
      g.addColorStop(0,'hsla('+b.hue+',75%,78%,0.5)');
      g.addColorStop(1,'hsla('+b.hue+',65%,55%,0.14)');
      cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.2832);cx.fill();
      cx.strokeStyle='hsla('+b.hue+',80%,80%,0.4)';cx.lineWidth=1.2;cx.stroke();
    });
    GAME.raf=requestAnimationFrame(loop);
  };
  loop();
  cv.addEventListener('pointerdown',function(e){
    if(!GAME)return;
    const r2=cv.getBoundingClientRect();
    const px=e.clientX-r2.left,py=e.clientY-r2.top;
    for(let i=GAME.bub.length-1;i>=0;i--){
      const b=GAME.bub[i];
      if((px-b.x)*(px-b.x)+(py-b.y)*(py-b.y)<=(b.r+10)*(b.r+10)){
        GAME.bub.splice(i,1);
        beep(400+Math.random()*520,0.11,0.08,'sine');vib(11);
        GAME.ok++;GAME.runde++;
        if(GAME.ok%12===0&&GAME.stufe<8)GAME.stufe++;
        gStat();break;
      }
    }
  });
}

/* --- 8. Arithmetik --- */
function arStart(){
  gHint('Tippe das richtige Ergebnis. Bei einem Fehler geht es einfach weiter.');
  arRunde();
}
function arRunde(){
  if(!GAME)return;
  GAME.runde++;gStat();GAME.sperre=false;
  const s=GAME.stufe;
  let a,b,op;
  if(s<=2){a=2+rnd(9);b=2+rnd(9);op=Math.random()<0.5?'+':'−';}
  else if(s<=4){a=5+rnd(25);b=2+rnd(15);op=Math.random()<0.5?'+':'−';}
  else if(s<=6){a=2+rnd(9);b=2+rnd(9);op='×';}
  else{a=10+rnd(40);b=2+rnd(12);op=['+','−','×'][rnd(3)];}
  if(op==='−'&&b>=a){const t=a;a=b+1+rnd(4);b=t;}
  const erg=op==='+'?a+b:(op==='−'?a-b:a*b);
  GAME.loesung=erg;
  const opts=[erg];
  let schutz=0;
  while(opts.length<4&&schutz++<80){
    const spann=Math.max(3,Math.round(Math.abs(erg)*0.22));
    const d=erg+(rnd(2)?1:-1)*(1+rnd(spann));
    if(opts.indexOf(d)<0)opts.push(d);
  }
  while(opts.length<4)opts.push(erg+opts.length*7);
  shuffle(opts);
  document.getElementById('gmStage').innerHTML=
    '<div class="gm-q">'+a+' '+op+' '+b+'</div><div class="gm-opts">'
    +opts.map(o=>'<button class="gm-opt" data-v="'+o+'" onclick="arTipp('+o+')">'+o+'</button>').join('')+'</div>';
}
function arTipp(v){
  if(!GAME||GAME.sperre)return;GAME.sperre=true;
  document.querySelectorAll('.gm-opt').forEach(b=>{
    const bv=parseInt(b.getAttribute('data-v'),10);
    if(bv===GAME.loesung)b.classList.add('gut');
    else if(bv===v)b.classList.add('falsch');
  });
  const richtig=v===GAME.loesung;
  if(richtig)gGut();else gNaja();
  gT(arRunde,richtig?460:1150);
}
window.arTipp=arTipp;

/* --- 11. Das eine andere --- */
const AND_PAARE=[['7','1'],['3','8'],['O','Q'],['B','8'],['M','N'],['C','G'],['5','S'],['U','V'],['E','F'],['9','6'],['i','j'],['V','Y']];
function andStart(){andRunde();}
function andRunde(){
  if(!GAME)return;
  GAME.runde++;gStat();GAME.sperre=false;
  const s=GAME.stufe;
  const cols=Math.min(4+Math.floor((s-1)*0.6),8);
  const rows=Math.min(cols+1,9);
  const n=cols*rows;
  GAME.ziel=rnd(n);
  const zellPx=(320-4*(cols-1))/cols;
  const basis=zellPx*0.55;
  const arten=['zeichen','gesicht','groesse'];
  const art=arten[GAME.runde%3];
  let zellen=[],hinweis='';
  if(art==='zeichen'){
    const p=AND_PAARE[rnd(AND_PAARE.length)];
    const dreh=rnd(2);
    const fuell=p[dreh],ziel=p[1-dreh];
    for(let i=0;i<n;i++)zellen.push({t:i===GAME.ziel?ziel:fuell,g:100});
    hinweis='Ein Zeichen ist anders als alle anderen.';
  }else if(art==='gesicht'){
    const um=rnd(2);
    const a=um?'☹':'☺',b=um?'☺':'☹';
    for(let i=0;i<n;i++)zellen.push({t:i===GAME.ziel?b:a,g:100});
    hinweis='Ein Gesicht passt nicht zu den anderen.';
  }else{
    const gross=rnd(2);
    const delta=Math.max(4,15-s);
    for(let i=0;i<n;i++){
      let g;
      if(i===GAME.ziel)g=gross?100:42;
      else g=gross?(100-delta-rnd(10)):(42+delta+rnd(10));
      zellen.push({t:'▲',g:g});
    }
    hinweis=gross?'Tippe das größte Dreieck.':'Tippe das kleinste Dreieck.';
  }
  const st=document.getElementById('gmStage');
  st.classList.add('roll');
  let h='<div class="gm-raster" style="grid-template-columns:repeat('+cols+',1fr)">';
  zellen.forEach((z,i)=>{
    h+='<div class="gm-zelle" style="font-size:'+(basis*z.g/100).toFixed(1)+'px" onclick="andTipp('+i+')">'+z.t+'</div>';
  });
  h+='</div>';
  st.innerHTML=h;
  gHint(hinweis);
}
function andTipp(i){
  if(!GAME||GAME.sperre)return;GAME.sperre=true;

  const richtig=i===GAME.ziel;
  if(zellen[GAME.ziel])zellen[GAME.ziel].classList.add('gut');
  if(richtig)gGut();
  else{gNaja();if(zellen[i])zellen[i].classList.add('falsch');}
  gT(andRunde,richtig?520:1300);
}

/* --- 12. Glühbirnen --- */
function glStart(){glNeu();}
function glNeu(){
  if(!GAME)return;
  GAME.runde++;gStat();GAME.sperre=false;
  const s=GAME.stufe;
  GAME.netz=[];
  for(let i=0;i<9;i++){
    const menge=[i];
    const anz=s<=2?1:(s<=5?1+rnd(2):2);
    const kand=shuffle([0,1,2,3,4,5,6,7,8].filter(x=>x!==i));
    for(let k=0;k<anz&&k<kand.length;k++)menge.push(kand[k]);
    GAME.netz.push(menge);
  }
  const zuege=Math.min(2+s,8);
  let versuch=0;
  do{
    GAME.an=[1,1,1,1,1,1,1,1,1];
    for(let z=0;z<zuege;z++)glSchalte(rnd(9));
    versuch++;
  }while(GAME.an.every(x=>x===1)&&versuch<25);
  GAME.zuege=0;
  glRender('Alle zum Leuchten bringen');
}
function glSchalte(i){
  GAME.netz[i].forEach(j=>{GAME.an[j]=GAME.an[j]?0:1;});
}
function glRender(text){
  const st=document.getElementById('gmStage');
  if(!st)return;
  let h='<div class="gm-mid" id="glTxt">'+esc(text)+'</div><div class="gm-birnen">';
  for(let i=0;i<9;i++)h+='<div class="gm-birne'+(GAME.an[i]?' an':'')+'" onclick="glTipp('+i+')">💡</div>';
  h+='</div><div class="gm-stat">'+GAME.zuege+' Züge</div><button class="tm-b" onclick="glNeu()">Neu mischen</button>';
  st.innerHTML=h;
  gHint('Jede Lampe schaltet noch andere mit. Probier aus, welche.');
}
function glTipp(i){
  if(!GAME||GAME.sperre)return;
  glSchalte(i);GAME.zuege++;
  beep(420+i*35,0.09,0.07,'triangle');vib(10);
  const fertig=GAME.an.every(x=>x===1);
  glRender(fertig?('Alle an – in '+GAME.zuege+' Zügen'):'Alle zum Leuchten bringen');
  if(fertig){
    GAME.sperre=true;gGut();
    gT(glNeu,1500);
  }
}
window.glTipp=glTipp;window.glNeu=glNeu;

/* --- 13. Zählen --- */
const ZFARBEN=[['blaue','#60a5fa'],['grüne','#4ade80'],['rote','#f87171'],['gelbe','#fbbf24'],['lila','#c084fc']];
const ZSYM=['▲','●','■','★','◆','♥','✦','▼'];
function zaStart(){zaRunde();}
function zaRunde(){
  if(!GAME)return;
  GAME.runde++;gStat();GAME.sperre=false;GAME.wert=0;
  const s=GAME.stufe;
  const cols=Math.min(4+Math.floor((s-1)*0.5),7);
  const rows=Math.min(cols+1,8);
  const n=cols*rows;
  const zellPx=(320-4*(cols-1))/cols;
  const modus=(s>=3&&GAME.runde%2===0)?'verschieden':'farbe';
  let zellen='',frage='';
  if(modus==='farbe'){
    const anzF=Math.min(2+Math.floor(s/3),5);
    const farben=shuffle(ZFARBEN.slice()).slice(0,anzF);
    const zielF=farben[rnd(anzF)];
    let treffer=0;
    for(let i=0;i<n;i++){
      const f=farben[rnd(anzF)];
      if(f===zielF)treffer++;
      zellen+='<div class="gm-zelle" style="background:'+f[1]+';border-color:transparent"></div>';
    }
    GAME.loesung=treffer;
    frage='Wie viele '+zielF[0]+' Felder?';
  }else{
    const anz=Math.min(3+rnd(1+Math.floor(s/2)),8);
    const syms=shuffle(ZSYM.slice()).slice(0,anz);
    const feld=syms.slice();
    while(feld.length<n)feld.push(syms[rnd(anz)]);
    shuffle(feld);
    GAME.loesung=anz;
    frage='Wie viele verschiedene Zeichen?';
    feld.forEach(x=>{zellen+='<div class="gm-zelle" style="font-size:'+(zellPx*0.5).toFixed(1)+'px">'+x+'</div>';});
  }
  const st=document.getElementById('gmStage');
  st.classList.add('roll');
  st.innerHTML='<div class="gm-mid" id="zaFrage">'+esc(frage)+'</div>'
    +'<div class="gm-raster" style="grid-template-columns:repeat('+cols+',1fr)">'+zellen+'</div>'
    +'<div class="gm-zaehler"><button class="gm-zbtn" onclick="zaAdd(-1)">−</button>'
    +'<div class="gm-zwert" id="zaWert">0</div>'
    +'<button class="gm-zbtn" onclick="zaAdd(1)">+</button></div>'
    +'<button class="btn btn-p" style="max-width:320px" onclick="zaPruef()">Stimmt</button>';
  gHint('Zähl in Ruhe – es läuft keine Zeit.');
}
function zaAdd(d){
  if(!GAME||GAME.sperre)return;
  GAME.wert=Math.max(0,(GAME.wert||0)+d);
  const el=document.getElementById('zaWert');
  if(el)el.textContent=GAME.wert;
  beep(d>0?560:420,0.05,0.05,'sine');
}
function zaPruef(){
  if(!GAME||GAME.sperre)return;GAME.sperre=true;
  const richtig=GAME.wert===GAME.loesung;
  const f=document.getElementById('zaFrage');
  if(richtig){gGut();if(f)f.textContent='Stimmt – '+GAME.loesung;}
  else{gNaja();if(f)f.textContent='Es waren '+GAME.loesung+', du hattest '+GAME.wert;}
  gT(zaRunde,richtig?900:2000);
}
window.zaAdd=zaAdd;window.zaPruef=zaPruef;

/* --- 14. Das schnellste Rad --- */
function raStart(){raRunde();}
function raRunde(){
  if(!GAME)return;
  GAME.runde++;gStat();GAME.sperre=false;
  const s=GAME.stufe;
  const langsam=(s>=5&&GAME.runde%3===0);
  const basis=1.4+Math.random()*0.7;
  const spanne=Math.max(0.18,1.15-s*0.12);
  const zeiten=[];
  for(let i=0;i<9;i++)zeiten.push(basis*(1+spanne*(i/8)));
  const idx=shuffle([0,1,2,3,4,5,6,7,8]);
  const gesucht=langsam?8:0;
  GAME.loesung=idx.indexOf(gesucht);
  let h='<div class="gm-mid">'+(langsam?'Tippe das <span style="color:var(--accent)">langsamste</span> Rad':'Tippe das <span style="color:var(--accent)">schnellste</span> Rad')+'</div><div class="gm-raeder">';
  for(let j=0;j<9;j++){
    const rueck=(s>=3&&j%2===1)?'animation-direction:reverse;':'';
    h+='<div class="gm-rad" onclick="raTipp('+j+')"><div class="gm-rad-in" style="animation-duration:'+zeiten[idx[j]].toFixed(2)+'s;'+rueck+'"></div></div>';
  }
  h+='</div>';
  document.getElementById('gmStage').innerHTML=h;
  gHint(s>=3?'Manche drehen rückwärts – die Richtung zählt nicht, nur das Tempo.':'Schau in Ruhe, es läuft keine Zeit.');
}
function raTipp(j){
  if(!GAME||GAME.sperre)return;GAME.sperre=true;
  const raeder=document.querySelectorAll('.gm-rad');
  const richtig=j===GAME.loesung;
  if(raeder[GAME.loesung])raeder[GAME.loesung].classList.add('gut');
  if(richtig)gGut();
  else{gNaja();if(raeder[j])raeder[j].classList.add('falsch');}
  gT(raRunde,richtig?700:1600);
}
window.raTipp=raTipp;

const SPIEL_START={stroop:stroopStart,bubbles:bubStart,quadrat:qmStart,morse:moStart,perc:perStart,pitch:pmStart,zuletzt:zhStart,rechnen:arStart,countdown:cdStart,farblogik:flStart,anders:andStart,birnen:glStart,zaehlen:zaStart,raeder:raStart};

/* ============ LISTE & FILTER ============ */
let LVL=5, FILTER_AN=true;
try{const s=localStorage.getItem('skl_lvl');if(s!==null)LVL=parseInt(s);const f=localStorage.getItem('skl_filter');if(f!==null)FILTER_AN=(f==='1');}catch(e){}

const LVL_TEXT=[
  'Ruhig. Guter Moment, um vorzubauen und Skills zu üben, solange es leicht geht.',
  'Ruhig. Guter Moment, um vorzubauen und Skills zu üben, solange es leicht geht.',
  'Leichte Anspannung. Du kannst noch gut denken – Zeit für die Skills, die etwas verändern.',
  'Spürbar unruhig. Emotionsregulation greift hier noch gut.',
  'Deutlich angespannt. Erst runterkommen, dann analysieren.',
  'Mittlere Anspannung. Ablenkung und Selbstberuhigung sind jetzt sinnvoll.',
  'Hoch. Denken wird schwierig – nimm die körpernahen Skills.',
  'Sehr hoch. Jetzt keine Entscheidungen treffen. Erst STOP, dann Körper.',
  'Sehr hoch. Über den Körper arbeiten, nicht über den Kopf.',
  'Hochstress. Nur noch kurze, körperliche Skills. Ein Schritt nach dem anderen.',
  'Hochstress. Nur noch kurze, körperliche Skills. Ein Schritt nach dem anderen.'
];

function setModus(an){
  FILTER_AN=an;
  try{localStorage.setItem('skl_filter',an?'1':'0');}catch(e){}
  document.getElementById('tgFilter').classList.toggle('active',an);
  document.getElementById('tgAlle').classList.toggle('active',!an);
  renderListe();
}
window.setModus=setModus;

function renderListe(){
  const host=document.getElementById('skillsList');
  const alle=SKILLS.concat(GAMES);
  const liste=FILTER_AN?alle.filter(s=>LVL>=s.min&&LVL<=s.max):alle;
  if(!liste.length){
    host.innerHTML='<div class="empty-state">Für diesen Wert ist gerade nichts hinterlegt.<br>Schau dir alle Skills an oder verschiebe den Regler.</div>';
    return;
  }
  let html='';
  ['st','er','zw','sp'].forEach(k=>{
    const grp=liste.filter(s=>s.kat===k);
    if(!grp.length)return;
    html+='<div class="kat-head">'+KAT[k].name+'</div>';
    if(k==='sp')html+='<div class="kat-info">'+esc(KAT.sp.info)+'</div>';
    grp.forEach(s=>{
      const fn=s.typ==='game'?'startGame':'startSkill';
      html+='<div class="skill-card" onclick="'+fn+'(\''+s.id+'\')">'
        +'<div class="skill-ic">'+s.icon+'</div>'
        +'<div class="skill-body">'
        +'<div class="skill-title">'+esc(s.titel)+'</div>'
        +'<div class="skill-sub">'+esc(s.sub)+'</div>'
        +'<div class="skill-meta"><span class="range-pill">Anspannung '+s.min+'–'+s.max+'</span><span class="dauer-pill">'+esc(s.dauer)+'</span></div>'
        +'</div></div>';
    });
  });
  host.innerHTML=html;
}

function updateLvl(v){
  LVL=parseInt(v);
  document.getElementById('lvlVal').textContent=LVL;
  document.getElementById('lvlState').textContent=LVL_TEXT[LVL];
  try{localStorage.setItem('skl_lvl',String(LVL));}catch(e){}
  renderListe();
}

/* ============ SCHRITT-ENGINE ============ */
let RUN=null;

function stopTimers(){
  if(!RUN)return;
  if(RUN.iv){clearInterval(RUN.iv);RUN.iv=null;}
  if(RUN.to){clearTimeout(RUN.to);RUN.to=null;}
}

function openSkillDetail(title,html){
  document.getElementById('skillDetailTitle').textContent=title;
  document.getElementById('skillDetailBody').innerHTML=html;
  document.getElementById('ov-skill-detail').classList.add('active');
}
function closeSkillDetail(){
  stopTimers();stopGame();
  RUN=null;
  document.getElementById('ov-skill-detail').classList.remove('active');
  document.getElementById('skillDetailBody').innerHTML='';
}
window.openSkillDetail=openSkillDetail;
window.closeSkillDetail=closeSkillDetail;

function startSkill(id){
  const s=SKILLS.find(x=>x.id===id);
  if(!s)return;
  stopGame();
  RUN={s:s,i:0,d:{},iv:null,to:null};
  openSkillDetail(s.titel,'<div class="st-wrap" id="stHost"></div>');
  renderStep();
}
window.startSkill=startSkill;

function saveCurrentInput(){
  if(!RUN)return;
  const st=RUN.s.steps[RUN.i];
  if(!st)return;
  if(st.t==='eingabe'){
    const el=document.getElementById('stInput');
    if(el)RUN.d[st.key]=el.value.trim();
  }else if(st.t==='skala'){
    const el=document.getElementById('stSkala');
    if(el)RUN.d[st.key]=el.value;
  }else if(st.t==='check'){
    RUN.d['_check_'+RUN.i]=Array.from(document.querySelectorAll('.ck-item.on')).map(e=>e.dataset.txt);
  }
}

function nextStep(){
  saveCurrentInput();stopTimers();
  if(RUN.i<RUN.s.steps.length-1){RUN.i++;renderStep();}
  else closeSkillDetail();
}
function prevStep(){
  saveCurrentInput();stopTimers();
  if(RUN.i>0){RUN.i--;renderStep();}
}
window.nextStep=nextStep;window.prevStep=prevStep;

function renderStep(){
  const st=RUN.s.steps[RUN.i], n=RUN.s.steps.length, host=document.getElementById('stHost');
  const pct=Math.round(((RUN.i+1)/n)*100);
  let body='';

  if(st.t==='info'||st.t==='ende'){
    body='<div class="st-h">'+esc(st.h)+'</div>'+(st.p?'<div class="st-p">'+esc(st.p).replace(/\n/g,'<br>')+'</div>':'');
    if(st.t==='ende')body='<div class="done-ic">🌿</div>'+body;
  }
  else if(st.t==='timer'){
    body='<div class="st-h">'+esc(st.h)+'</div><div class="st-p">'+esc(st.p)+'</div>'
      +'<div class="tm-wrap">'
      +'<div class="tm-ring"><svg viewBox="0 0 150 150"><circle class="tm-track" cx="75" cy="75" r="66"/><circle class="tm-fill" id="tmFill" cx="75" cy="75" r="66" stroke-dasharray="414.7" stroke-dashoffset="0"/></svg><div class="tm-val" id="tmVal">'+fmt(st.sek)+'</div></div>'
      +'<div class="tm-btns"><button class="tm-b prim" id="tmBtn" onclick="toggleTimer()">Start</button><button class="tm-b" onclick="resetTimer()">Zurücksetzen</button></div>'
      +'</div>';
  }
  else if(st.t==='atem'){
    body='<div class="st-h">'+esc(st.h)+'</div><div class="st-p">'+esc(st.p)+'</div>'
      +'<div class="at-wrap"><div class="at-c" id="atC">'+st.runden+'</div>'
      +'<div class="at-lbl" id="atLbl">Bereit?</div><div class="at-sub" id="atSub">'+st.ein+' ein'+(st.halt?' · '+st.halt+' halten':'')+' · '+st.aus+' aus</div>'
      +'<button class="tm-b prim" id="atBtn" onclick="toggleAtem()">Start</button></div>';
  }
  else if(st.t==='eingabe'){
    const val=RUN.d[st.key]||'';
    body='<div class="st-h">'+esc(st.h)+'</div>'+(st.p?'<div class="st-p">'+esc(st.p)+'</div>':'')
      +(st.multi
        ?'<textarea id="stInput" rows="5" placeholder="'+esc(st.ph)+'">'+esc(val)+'</textarea>'
        :'<input type="text" id="stInput" placeholder="'+esc(st.ph)+'" value="'+esc(val)+'">');
  }
  else if(st.t==='check'){
    const prev=RUN.d['_check_'+RUN.i]||[];
    body='<div class="st-h">'+esc(st.h)+'</div>'+(st.p?'<div class="st-p">'+esc(st.p)+'</div>':'')+'<div class="st-li">';
    st.items.forEach(it=>{
      const on=prev.indexOf(it)>=0;
      body+='<div class="ck-item'+(on?' on':'')+'" data-txt="'+esc(it)+'" onclick="this.classList.toggle(\'on\');vib(12);"><div class="ck-box">✓</div><div class="ck-txt">'+esc(it)+'</div></div>';
    });
    body+='</div>';
  }
  else if(st.t==='skala'){
    const val=RUN.d[st.key]||LVL;
    body='<div class="st-h">'+esc(st.h)+'</div>'+(st.p?'<div class="st-p">'+esc(st.p)+'</div>':'')
      +'<div class="sk-val" id="skVal">'+val+'</div>'
      +'<input type="range" min="0" max="10" step="1" value="'+val+'" id="stSkala" oninput="document.getElementById(\'skVal\').textContent=this.value">'
      +'<div class="scale-marks"><span>0</span><span>5</span><span>10</span></div>';
  }
  else if(st.t==='zf'){
    const blocks=st.fn(RUN.d).filter(b=>b[1]&&String(b[1]).trim());
    body='<div class="st-h">'+esc(st.h)+'</div>';
    if(!blocks.length){
      body+='<div class="st-p">Du hast nichts notiert – das ist auch okay. Der Durchgang zählt trotzdem.</div>';
    }else{
      body+='<div class="zf-box" id="zfBox">';
      blocks.forEach(b=>{body+='<div class="zf-blk"><span class="zf-lbl">'+esc(b[0])+'</span>'+esc(b[1]).replace(/\n/g,'<br>')+'</div>';});
      body+='</div><button class="tm-b" style="align-self:flex-start;" onclick="kopiere()">Text kopieren</button>';
      RUN.zfText=blocks.map(b=>b[0].toUpperCase()+'\n'+b[1]).join('\n\n');
    }
  }

  if(st.note)body+='<div class="st-note">'+esc(st.note)+'</div>';

  const letzter=RUN.i===n-1;
  host.innerHTML='<div class="st-prog"><div class="st-bar" style="width:'+pct+'%"></div></div>'
    +'<div class="st-count">Schritt '+(RUN.i+1)+' von '+n+' · '+KAT[RUN.s.kat].name+'</div>'
    +'<div class="st-main">'+body+'</div>'
    +'<div class="st-nav">'
    +(RUN.i>0?'<button class="btn btn-g" onclick="prevStep()">Zurück</button>':'')
    +'<button class="btn btn-p" onclick="nextStep()">'+(letzter?'Fertig':'Weiter')+'</button>'
    +'</div>';
  document.getElementById('skillDetailBody').scrollTop=0;
}

function fmt(s){const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}

/* --- Timer --- */
function toggleTimer(){
  const st=RUN.s.steps[RUN.i], btn=document.getElementById('tmBtn');
  if(RUN.iv){stopTimers();btn.textContent='Weiter';return;}
  if(RUN.rest==null||RUN.rest<=0)RUN.rest=st.sek;
  btn.textContent='Pause';
  try{gCtx().resume();}catch(e){}
  tick(st);
  RUN.iv=setInterval(()=>tick(st),1000);
}
function tick(st){
  RUN.rest--;
  const v=document.getElementById('tmVal'),f=document.getElementById('tmFill');
  if(!v||!f){stopTimers();return;}
  v.textContent=fmt(Math.max(0,RUN.rest));
  f.setAttribute('stroke-dashoffset',String(414.7*(1-Math.max(0,RUN.rest)/st.sek)));
  if(RUN.rest<=0){
    stopTimers();RUN.rest=null;
    beep(660,0.5,0.14,'sine');vib([60,60,60]);
    const b=document.getElementById('tmBtn');if(b)b.textContent='Nochmal';
  }
}
function resetTimer(){
  const st=RUN.s.steps[RUN.i];stopTimers();RUN.rest=st.sek;
  const v=document.getElementById('tmVal'),f=document.getElementById('tmFill'),b=document.getElementById('tmBtn');
  if(v)v.textContent=fmt(st.sek);if(f)f.setAttribute('stroke-dashoffset','0');if(b)b.textContent='Start';
}
window.toggleTimer=toggleTimer;window.resetTimer=resetTimer;

/* --- Atem --- */
function toggleAtem(){
  const st=RUN.s.steps[RUN.i],btn=document.getElementById('atBtn');
  if(RUN.to||RUN.atLauft){stopTimers();RUN.atLauft=false;btn.textContent='Weiter';
    const c=document.getElementById('atC');if(c)c.style.transform='';
    const l=document.getElementById('atLbl');if(l)l.textContent='Pause';return;}
  RUN.atLauft=true;RUN.runde=0;btn.textContent='Stopp';
  try{gCtx().resume();}catch(e){}
  atemPhase(st,0);
}
function atemPhase(st,p){
  if(!RUN||!RUN.atLauft)return;
  const c=document.getElementById('atC'),l=document.getElementById('atLbl'),s=document.getElementById('atSub');
  if(!c||!l)return;
  const phasen=[['Einatmen',st.ein,1.35],['Halten',st.halt,1.35],['Ausatmen',st.aus,1]].filter(x=>x[1]>0);
  if(p>=phasen.length){
    RUN.runde++;
    if(RUN.runde>=st.runden){
      RUN.atLauft=false;l.textContent='Fertig';c.textContent='✓';s.textContent='';
      beep(660,0.5,0.12,'sine');
      const b=document.getElementById('atBtn');if(b)b.textContent='Nochmal';
      return;
    }
    p=0;
  }
  const [name,sek,scale]=phasen[p];
  l.textContent=name;
  c.style.transition='transform '+sek+'s ease-in-out, background 1s, border-color 1s';
  c.style.transform='scale('+scale+')';
  c.textContent=st.runden-RUN.runde;
  s.textContent='Runde '+(RUN.runde+1)+' von '+st.runden;
  if(name==='Einatmen')beep(520,0.14,0.07,'sine');
  if(name==='Ausatmen')beep(390,0.14,0.07,'sine');
  let left=sek;
  RUN.iv=setInterval(()=>{left--;if(left>0&&l)l.textContent=name+' · '+left;},1000);
  RUN.to=setTimeout(()=>{if(RUN&&RUN.iv){clearInterval(RUN.iv);RUN.iv=null;}atemPhase(st,p+1);},sek*1000);
}
window.toggleAtem=toggleAtem;

/* --- Kopieren --- */
function kopiere(){
  const txt=RUN&&RUN.zfText?RUN.zfText:'';
  if(!txt)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Kopiert')).catch(()=>toast('Kopieren nicht möglich'));
  }else{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Kopiert');}catch(e){toast('Kopieren nicht möglich');}
    document.body.removeChild(ta);
  }
}
window.kopiere=kopiere;

/* ============ INIT ============ */
document.getElementById('lvlSlider').value=LVL;
document.getElementById('lvlSlider').addEventListener('input',e=>updateLvl(e.target.value));
document.getElementById('tgFilter').classList.toggle('active',FILTER_AN);
document.getElementById('tgAlle').classList.toggle('active',!FILTER_AN);
updateLvl(LVL);
</script>
